name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Engines come from engines/download-engines.mjs (or the dedicated engine-launch job), never from
  # an npm postinstall.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  PUPPETEER_SKIP_DOWNLOAD: '1'

jobs:
  web:
    name: Web (typecheck / build / test / format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run format:check
      # Generate the Prisma client so the backend typechecks (no DB connection needed to generate).
      - run: npx prisma generate --schema=apps/backend/prisma/schema.prisma
      - run: npm run typecheck --workspaces --if-present
      - run: npm run build --if-present
      - run: npm run test --workspaces --if-present
      # apps/web is intentionally outside the npm workspace because it pins its own Angular and
      # TypeScript graph. Validate that independent lockfile explicitly; the workspace commands
      # above cannot see it.
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm test -- --watch=false
        working-directory: apps/web

  # The `gate:*` scripts in the root package.json. Every one of them is pure Node over files already
  # in the checkout — no engine, no GPU, no database, no browser — and none of them ran in any
  # workflow, so the contracts they encode were enforced only when somebody remembered to type the
  # command. They are separated from the other jobs because they are seconds long and they fail with
  # a precise reason, which makes this the job a reviewer reads first.
  #
  # `gate:series` is NOT here: it replays the patch series against a Chromium checkout and is
  # therefore meaningless on a runner that has none (see the patch-series job below). `gate:kernels`
  # is not here either — it is a PowerShell entry point for the Windows build host.
  offline-gates:
    name: Offline gates (engine contracts / desktop CSS / migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --no-audit --no-fund
      # Patch-series well-formedness, version coherence across the pins, and source hygiene (ASCII,
      # no BOM, strict-JSON parses). These read the tree, never a build.
      - run: npm run gate:engine
      # Every class the desktop markup uses has a rule. A deleted rule is invisible in review and
      # ships as an unstyled control.
      - run: npm run gate:desktop-css
      # The Prisma migration chain applied to PGlite — real Postgres compiled to WASM, so it needs no
      # service container and no DATABASE_URL. It asserts the schema AND the billing invariants
      # (conditional debit refuses an overdraw, a deposit credits exactly once).
      - run: npm run gate:migrations

  # The desktop UI end-to-end suite. `apps/desktop/e2e` had no Playwright config and no workflow, so
  # `npx playwright test` collected nothing and eleven specs ran nowhere for as long as they existed.
  #
  # This needs no Tauri shell: the UI falls back to its in-memory mock client whenever
  # `__TAURI_INTERNALS__` is absent (apps/desktop/src/api/tauri.ts), so a plain Chromium against the
  # vite dev server exercises the real components, reducers and validation.
  #
  # BLOCKING on purpose. Six of the eleven specs currently assert the pre-migration UI — a native
  # <select> for the OS field where the shell now renders a listbox button, a removed
  # 'Open command palette' button, renderer mode 'host' where the default is now a per-OS preset —
  # and they must be updated with the UI, not carried as a permanent `continue-on-error`. A suite
  # that cannot red the branch is a suite nobody repairs.
  desktop-e2e:
    name: Desktop UI e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --no-audit --no-fund
      # The global PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD only suppresses the postinstall hook; this is the
      # explicit install, and it is the one browser this suite runs.
      - run: npx playwright install --with-deps chromium
      # The config starts the vite dev server itself (webServer), so there is nothing to launch here.
      - run: npm run e2e:desktop
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # `gate:series` — replay every patch in lobium/patches/series into a scratch tree built from
  # pristine git blobs and diff the result against the working checkout. It is the only check that
  # proves the series reproduces the binary that was actually tested: a hook present in the checkout
  # but missing from its patch still reports itself in the capability manifest, so the sidecar would
  # launch profiles trusting spoofing the next clean build does not contain.
  #
  # OPT-IN on the build host, NOT a github-hosted job and NOT advisory. It needs a Chromium checkout
  # at LOBIUM_CHROMIUM_SRC. It refuses any checkout whose HEAD is not the pinned Chromium ref, then
  # fails on any live-tree footprint drift from the reproducible series. Wiring it as a required
  # check on a runner without the tree would make it permanently red, which is how a real signal gets
  # trained out of a team. Enable LOBSTER_ENABLE_SERIES_REPLAY on a self-hosted runner labelled
  # `lobium-build` whose checkout is synced to the pinned ref, and it blocks from that moment.
  patch-series:
    name: Patch series replay (build host, opt-in)
    runs-on: [self-hosted, lobium-build]
    if: ${{ vars.LOBSTER_ENABLE_SERIES_REPLAY == 'true' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Replay the series against the pristine tree
        env:
          LOBIUM_CHROMIUM_SRC: ${{ vars.LOBIUM_CHROMIUM_SRC }}
        run: |
          # An enabled gate with a missing prerequisite must FAIL rather than skip: verify-series.mjs
          # would otherwise stage zero pristine blobs and report every patch as a clean apply against
          # empty files, which is a green run that proves nothing.
          if [ -z "${LOBIUM_CHROMIUM_SRC:-}" ] || [ ! -d "$LOBIUM_CHROMIUM_SRC/.git" ]; then
            echo "::error::LOBIUM_CHROMIUM_SRC is unset or is not a git checkout ($LOBIUM_CHROMIUM_SRC)."
            echo "Point the repo variable at the Chromium tree this runner builds from."
            exit 1
          fi
          npm run gate:series

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust:
    name: Desktop (Rust build / test / fmt / clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config \
            libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      # The toolchain version is pinned by rust-toolchain.toml (>= 1.85 for edition2024 deps).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Frontend dist stub (so generate_context! has assets without a full JS build)
        run: |
          mkdir -p apps/desktop/dist
          echo '<!doctype html><html><head><meta charset="utf-8"><title>Lobster</title></head><body><div id="root"></div></body></html>' > apps/desktop/dist/index.html
      - name: cargo fmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --lib --all-targets -- -D warnings
      # The sidecar and local-API unit tests launch the Rust test executable itself as a deterministic
      # JSON-RPC child, so this suite is self-contained and does not depend on Node or POSIX utilities.
      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib

  # Every job above runs on ubuntu-latest, so nothing in this repo is verified anywhere else — while
  # Windows is a shipping target (scripts/build-windows-product.ps1). That gap bites hardest on
  # per-profile data: Linux OSCrypt pins Chromium's fixed v10 cookie key, so a copied cookie jar keeps
  # working, while Windows (DPAPI) and macOS (Keychain) wrap that key per install — a persistence
  # change that keeps every session alive on this Linux box can log every Windows user out, green.
  # macOS ships no installer today (recorded in ci/validation/version-coherence.test.mjs:133); it is
  # here as the second Keychain-wrapped platform and the cheap POSIX-but-not-Linux signal.
  #
  # This job runs what is genuinely portable today, so a red here always means a real defect:
  #   - the complete release Rust library suite is blocking on Windows. Its sidecar child and profile
  #     crypto fixtures are deterministic and host-independent; no POSIX-tool or DPAPI carve-out remains.
  #   - the node:test suites run through ci/validation/cross-platform-suite.mjs rather than
  #     `npm run test --workspaces`: four individual test files are not portable today, and a
  #     permanently red job gates nothing. That script names every excluded file, the platform, and the
  #     reason, and it fails when an exclusion stops matching a real file, so a rename cannot silently
  #     un-run a suite.
  #   - no live-engine job (engine-launch, lobium-detect, product-e2e): those need a Lobium binary, a
  #     GPU and a provisioned open-font pack, none of which exist on a github-hosted Windows/macOS box.
  cross-platform:
    name: Cross-platform (${{ matrix.os }} typecheck / test / cargo)
    runs-on: ${{ matrix.os }}
    # A hung keychain or sidecar spawn must not sit on a runner for the 6-hour default.
    timeout-minutes: 60
    strategy:
      # A Windows-only or macOS-only failure is the entire reason this job exists — never let one
      # platform's failure cancel the other's evidence.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # `npm install`, not `npm ci`: the lockfile is generated on Linux, and the platform-specific
      # optional binaries (esbuild/rollup/vite/@tauri-apps/cli) have to be resolved for this runner.
      - run: npm install --no-audit --no-fund
      # Same reason as the web job: the backend typechecks against the generated Prisma client.
      - run: npx prisma generate --schema=apps/backend/prisma/schema.prisma
      - run: npm run typecheck --workspaces --if-present
      # The portable node:test suites.
      - run: node ci/validation/cross-platform-suite.mjs
      # The toolchain version is pinned by rust-toolchain.toml (>= 1.85 for edition2024 deps).
      - uses: dtolnay/rust-toolchain@stable
      - name: Frontend dist stub (so generate_context! has assets without a full JS build)
        # Both runner images ship bash, so this stays byte-identical to the `rust` job rather than
        # being rewritten for PowerShell.
        shell: bash
        run: |
          mkdir -p apps/desktop/dist
          echo '<!doctype html><html><head><meta charset="utf-8"><title>Lobster</title></head><body><div id="root"></div></body></html>' > apps/desktop/dist/index.html
      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --lib --all-targets
      - name: cargo test (Windows, blocking)
        if: matrix.os == 'windows-latest'
        working-directory: apps/desktop/src-tauri
        run: cargo test --release --lib -- --test-threads=1
      # macOS is the second Keychain-wrapped platform. The synthetic snapshot and sidecar fixtures no
      # longer touch the host keychain or assume POSIX helper commands, but the full suite has not yet
      # had a recorded macOS run.
      #
      # It is advisory ONLY because this suite has never executed on macOS anywhere, and a gate whose
      # first run reds the branch teaches the team to ignore gates. Promote it by deleting the
      # continue-on-error line after its first green run; do not leave it advisory once it has passed.
      - name: cargo test (macOS, advisory until its first green run)
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib
      # THE PER-PROFILE SNAPSHOT ROUND-TRIP, and the reason this job exists.
      #
      # These are the Phase 2 engine's own tests (capture -> destroy -> restore -> verify, over temp
      # dirs), and they are BLOCKING on both platforms — including macOS, where the rest of the Rust
      # suite is still advisory. That asymmetry is deliberate: the advisory carve-out above exists
      # because the whole suite has never run on macOS, whereas these tests are the one thing this
      # job is for. A cookie jar that stops restoring on a Keychain-wrapped platform is exactly the
      # failure that passes green on Linux, so it may not be advisory anywhere.
      #
      # Windows already runs these in the complete blocking suite above. Keep this focused blocking
      # invocation on macOS until the complete macOS suite is promoted from advisory.
      - name: Snapshot capture/restore round-trip (macOS, blocking)
        if: matrix.os == 'macos-latest'
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib 'snapshot::'
      # STILL MISSING, and named so it is not mistaken for covered: the LIVE round-trip — launch a
      # real Lobium, log in to a fixture site, capture, wipe the user-data-dir, restore, and assert
      # the site still considers the session valid. That needs a Lobium binary, a GPU and a font pack,
      # none of which a github-hosted Windows/macOS runner has (see the job comment above), so it
      # belongs on a self-hosted runner. Until it exists, CI proves the ENGINE round-trips artifacts
      # on this OS; it does not prove a browser still trusts them.
      - name: Live logged-in round-trip (self-hosted only)
        if: ${{ vars.LOBSTER_ENABLE_PRODUCT_E2E == 'true' }}
        shell: bash
        run: |
          if [ ! -f ci/validation/snapshot-roundtrip.mjs ]; then
            echo "PENDING: ci/validation/snapshot-roundtrip.mjs does not exist. The engine-level"
            echo "round-trip above IS blocking on ${{ matrix.os }}; what is unproven here is that a"
            echo "real browser still accepts a restored session. See docs/PROFILE_DATA_SYNC.md."
            exit 0
          fi
          node ci/validation/snapshot-roundtrip.mjs

  # QA-1: native Lobium detector gate. Skip-clean on github-hosted runners (no Lobium binary /
  # real GPU). On a self-hosted GPU runner set LOBSTER_LOBIUM_BIN + LOBSTER_GPU=gpu and remove
  # the `if:` skip so this job becomes blocking.
  lobium-detect:
    name: Native Lobium detector (opt-in GPU)
    runs-on: ubuntu-latest
    # Default CI has no Lobium binary — skip without failing the suite.
    if: ${{ vars.LOBSTER_ENABLE_LOBIUM_DETECT == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx tsc -b packages/shared-types packages/proxy packages/fingerprint packages/engine-runner
      - name: Run lobium-detect gate
        env:
          LOBSTER_LOBIUM_BIN: ${{ vars.LOBSTER_LOBIUM_BIN }}
          LOBSTER_GPU: gpu
          LOBSTER_ANGLE_BACKEND: ${{ vars.LOBSTER_ANGLE_BACKEND || 'vulkan' }}
          VK_ICD_FILENAMES: ${{ vars.VK_ICD_FILENAMES }}
          DISPLAY: ${{ vars.DISPLAY || ':0' }}
        run: |
          if [ -z "${LOBSTER_LOBIUM_BIN:-}" ] || [ ! -x "$LOBSTER_LOBIUM_BIN" ]; then
            echo "LOBSTER_LOBIUM_BIN unset or not executable — skipping lobium-detect (QA-1 opt-in)."
            exit 0
          fi
          node ci/validation/lobium-detect.mjs

  # The relaunch-persistence proof (docs/PROFILE_DATA_SYNC.md gap [27]). ci/validation/product-e2e.mjs
  # is the only check in the tree that creates a profile, launches a REAL browser through the same
  # sidecar path as the Launch button, injects cookies, navigates, stops, and relaunches to assert the
  # jar survived — and it ran in no workflow at all, only inside scripts/build-linux-product.sh.
  #
  # OPT-IN, because it cannot run on a github-hosted runner: it refuses to start without
  # LOBSTER_FONTS_DIR (product-e2e.mjs:142), i.e. a provisioned open-font pack, and it wants a real
  # engine. Set LOBSTER_ENABLE_PRODUCT_E2E=true on a self-hosted box that has both and it is blocking
  # from that moment — deliberately with no non-blocking mode, which is the mistake the packaging
  # script made for as long as it printed "[warn] product-e2e failed" and carried on.
  product-e2e:
    name: Product E2E (relaunch persistence, opt-in)
    runs-on: ubuntu-latest
    if: ${{ vars.LOBSTER_ENABLE_PRODUCT_E2E == 'true' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx tsc -b packages/shared-types packages/proxy packages/fingerprint packages/agent packages/engine-runner
      - name: Run the product E2E
        env:
          LOBSTER_LOBIUM_BIN: ${{ vars.LOBSTER_LOBIUM_BIN }}
          LOBSTER_FONTS_DIR: ${{ vars.LOBSTER_FONTS_DIR }}
          LOBSTER_GPU: ${{ vars.LOBSTER_GPU || 'software' }}
          LOBSTER_ANGLE_BACKEND: ${{ vars.LOBSTER_ANGLE_BACKEND }}
          VK_ICD_FILENAMES: ${{ vars.VK_ICD_FILENAMES }}
          DISPLAY: ${{ vars.DISPLAY }}
          LOBSTER_HEADFUL: ${{ vars.LOBSTER_HEADFUL || '0' }}
        run: |
          # An enabled gate with a missing prerequisite must FAIL, not skip: a silent skip here is how
          # a persistence gate ends up proving nothing while reporting green.
          if [ -z "${LOBSTER_FONTS_DIR:-}" ] || [ ! -d "$LOBSTER_FONTS_DIR" ]; then
            echo "LOBSTER_ENABLE_PRODUCT_E2E is true but LOBSTER_FONTS_DIR is unset or not a directory" >&2
            echo "(product-e2e reads <pack>/font-pack.manifest.json for the profile's font persona)" >&2
            exit 1
          fi
          node ci/validation/product-e2e.mjs

  engine-launch:
    name: Engine launch (patchright live Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --no-audit --no-fund
      # Download the patched Chromium + its system deps, then run the engine-runner suite. The live
      # launch integration test runs for real here (it skips where no browser is installed).
      - run: npx patchright install --with-deps chromium
      - run: npm test --workspace @lobster/engine-runner
      # The real-browser agent fixtures (docs/LOBEE_AGENT_ROADMAP.md §7.2). Everything below the model
      # is production code: the loop, the policy gates, the journal, and the CDP driver, against a real
      # browser and a real HTTP origin. Without this job the entire browser half of the agent is covered
      # only by fake CDP sessions that assert which commands are SENT, never what a browser does with
      # them — which is how a form that could not be filled at all shipped with a green suite.
      #
      # This runner has no Lobium binary, so the harness selects the interim Chromium and labels the
      # result browser-integration evidence rather than a Gate B pass. It must FAIL, never skip: exit 2
      # (no engine at all) is a blocked gate, not a green one.
      - name: Real-browser agent fixtures
        run: |
          npx tsc -b packages/shared-types packages/proxy packages/fingerprint packages/agent \
            packages/engine-runner
          node ci/validation/e2e/agent-browser-e2e.mjs --keep-going

  # The SOFTWARE tier of docs/OPERATIONS.md (§3): catalog diversity, coherence over 6000 personas, and
  # the derivation/coherence unit contracts. Runs anywhere — no GPU, no proxy, no browser.
  #
  # This job used to run `ci/validation/run.mjs`, which derived a fingerprint and applied it over CDP
  # through patchright. That harness was deleted with the CDP-spoofing path it exercised (production
  # fingerprinting is native — docs/ENGINEERING.md §1), so the job had been failing on every run. The
  # heavier tiers it cannot cover here are the real-GPU gate (real-gpu-gate.yml) and lobium-detect.
  fingerprint-gate:
    name: Fingerprint software gate (coherence / diversity / regressions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --no-audit --no-fund
      # Build the packages the harness imports, plus the fingerprint unit tests it runs from dist/.
      - run: npx tsc -b packages/shared-types packages/proxy packages/fingerprint packages/engine-runner
      - name: Run the software regression gate
        env:
          LOBSTER_LOBIUM_BIN: ${{ vars.LOBSTER_LOBIUM_BIN }}
        run: |
          # The live TLS/JA4 check reads a real ClientHello and therefore needs a built Lobium binary,
          # which github-hosted runners do not have. Skip it cleanly there (JA4 is gated on the
          # self-hosted real-GPU runner); run it whenever a binary IS provisioned.
          if [ -z "${LOBSTER_LOBIUM_BIN:-}" ] || [ ! -x "$LOBSTER_LOBIUM_BIN" ]; then
            echo "No Lobium binary on this runner — skipping the live TLS/JA4 check."
            export SKIP_TLS=1
          fi
          node ci/validation/regression-gate.mjs
      # Grader strength for the LIVE battery. Needs no browser, model or credit, so it runs here rather
      # than in the opt-in job: a grader that a model can satisfy blind turns a capability test into a
      # trivia quiz, and that regression must be caught on every PR.
      - run: node --test ci/validation/agent-battery.test.mjs
      # The validation harnesses' own tests. Each of these pins a grader or a contract that decides
      # whether a later gate can be trusted, and every one of them was executed by no workflow — so a
      # regression in the detector-matrix grader or the native-policy contract reached main green.
      - run: node ci/validation/detector-matrix.mjs --check
      - run: node --test ci/validation/detector-matrix.test.mjs ci/validation/antibot-exam.test.mjs ci/validation/native-policy-contract.test.mjs ci/validation/version-coherence.test.mjs
      # The offline half of the per-aspect anti-detect bar. Scoring the oracles needs an engine, but the
      # CONTRACT does not: every declared aspect must have an oracle, no oracle may land outside the
      # declared aspects, and an inconclusive measurement must never score as a pass. Those are the
      # rules a green number depends on, so they are checked on every PR rather than nightly on the GPU
      # box — a new aspect with no probe behind it is caught here, before it can be claimed.
      - run: node --test ci/validation/aspect-coverage.test.mjs
      # Shape-checks the manual detector ledger: an entry naming a tool or scenario that does not exist,
      # or claiming a verdict with no artifact behind it, is evidence that cannot be re-examined. Missing
      # evidence is reported, never failed — an empty ledger is an accurate statement, and reddening PRs
      # for it would only teach people to delete rows.
      - run: node ci/validation/detector-checklist.mjs --check
      # End-to-end conformance: launch a profile and assert the PAGE reports what the config asked for.
      #
      # This is the only check of its kind, and it was wired into nothing — no npm script, no workflow —
      # until 2026-08-26. That matters more here than it would elsewhere: every fingerprint hook in the
      # fork fails OPEN by construction (lobium/patches/series), so an unreadable or undersized config
      # produces a browser that launches happily and reports the HOST on every surface. The capability
      # contract proves the hooks are PRESENT; only this proves they are WORKING.
      #
      # It exits 2 = BLOCKED when no engine is provisioned, which is the normal state on a
      # github-hosted runner. BLOCKED must not read as a pass and must not redden the job — the same
      # distinction gate:oracles draws — so translate the code explicitly rather than using `|| true`,
      # which would swallow a genuine failure along with it.
      #
      # Run under Xvfb, because the harness is HEADFUL by default and that is deliberate: measured on
      # the same binary and persona, headless reports navigator.gpu present with a null adapter while
      # headful does not define navigator.gpu at all, and only the headful answer is what a user
      # ships. Passing --headless here would make the gate green on a browser the product never runs.
      # Without a display the launch fails for want of an X server, which this step would then report
      # as FAIL - an environment gap dressed up as a fingerprint defect.
      - name: Fingerprint conformance (BLOCKED without an engine)
        env:
          LOBSTER_LOBIUM_BIN: ${{ vars.LOBSTER_LOBIUM_BIN }}
        run: |
          set +e
          if [ -n "$LOBSTER_LOBIUM_BIN" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
            xvfb-run -a --server-args="-screen 0 1600x1000x24" npm run gate:conformance
          else
            npm run gate:conformance
          fi
          status=$?
          set -e
          case "$status" in
            0) echo "conformance: PASS" ;;
            2) echo "conformance: BLOCKED (no Lobium binary on this runner) — not a pass, not a failure" ;;
            *) echo "conformance: FAIL (exit $status)"; exit "$status" ;;
          esac
      # Offline W4 guard: the build ref, the UA-claimed version, and the engine manifest must agree,
      # and the pin must not be a canary/branch-point build. This is what would have caught the repo
      # sitting on canary 152.0.7928.0. The ONLINE half (is the pin behind stable / still a real
      # release) is scripts/track-upstream.mjs, run non-blocking so a new stable does not red every PR.
      - name: Chrome-version tracker (report only)
        continue-on-error: true
        run: node scripts/track-upstream.mjs
