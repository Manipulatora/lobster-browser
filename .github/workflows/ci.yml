name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Engines come from engines/download-engines.mjs (or the dedicated engine-launch job), never from
  # an npm postinstall.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  PUPPETEER_SKIP_DOWNLOAD: '1'

jobs:
  web:
    name: Web (typecheck / build / test / format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run format:check
      # Generate the Prisma client so the backend typechecks (no DB connection needed to generate).
      - run: npx prisma generate --schema=apps/backend/prisma/schema.prisma
      - run: npm run typecheck --workspaces --if-present
      - run: npm run build --if-present
      - run: npm run test --workspaces --if-present

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust:
    name: Desktop (Rust build / test / fmt / clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config \
            libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      # The toolchain version is pinned by rust-toolchain.toml (>= 1.85 for edition2024 deps).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Frontend dist stub (so generate_context! has assets without a full JS build)
        run: |
          mkdir -p apps/desktop/dist
          echo '<!doctype html><html><head><meta charset="utf-8"><title>Lobster</title></head><body><div id="root"></div></body></html>' > apps/desktop/dist/index.html
      - name: cargo fmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --lib --all-targets -- -D warnings
      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib

  # QA-1: native Lobium detector gate. Skip-clean on github-hosted runners (no Lobium binary /
  # real GPU). On a self-hosted GPU runner set LOBSTER_LOBIUM_BIN + LOBSTER_GPU=gpu and remove
  # the `if:` skip so this job becomes blocking.
  lobium-detect:
    name: Native Lobium detector (opt-in GPU)
    runs-on: ubuntu-latest
    # Default CI has no Lobium binary — skip without failing the suite.
    if: ${{ vars.LOBSTER_ENABLE_LOBIUM_DETECT == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx tsc -b packages/shared-types packages/proxy packages/fingerprint packages/engine-runner
      - name: Run lobium-detect gate
        env:
          LOBSTER_LOBIUM_BIN: ${{ vars.LOBSTER_LOBIUM_BIN }}
          LOBSTER_GPU: gpu
          LOBSTER_ANGLE_BACKEND: ${{ vars.LOBSTER_ANGLE_BACKEND || 'vulkan' }}
          VK_ICD_FILENAMES: ${{ vars.VK_ICD_FILENAMES }}
          DISPLAY: ${{ vars.DISPLAY || ':0' }}
        run: |
          if [ -z "${LOBSTER_LOBIUM_BIN:-}" ] || [ ! -x "$LOBSTER_LOBIUM_BIN" ]; then
            echo "LOBSTER_LOBIUM_BIN unset or not executable — skipping lobium-detect (QA-1 opt-in)."
            exit 0
          fi
          node ci/validation/lobium-detect.mjs

  engine-launch:
    name: Engine launch (patchright live Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --no-audit --no-fund
      # Download the patched Chromium + its system deps, then run the engine-runner suite. The live
      # launch integration test runs for real here (it skips where no browser is installed).
      - run: npx patchright install --with-deps chromium
      - run: npm test --workspace @lobster/engine-runner
      # The real-browser agent fixtures (docs/LOBEE_AGENT_ROADMAP.md §7.2). Everything below the model
      # is production code: the loop, the policy gates, the journal, and the CDP driver, against a real
      # browser and a real HTTP origin. Without this job the entire browser half of the agent is covered
      # only by fake CDP sessions that assert which commands are SENT, never what a browser does with
      # them — which is how a form that could not be filled at all shipped with a green suite.
      #
      # This runner has no Lobium binary, so the harness selects the interim Chromium and labels the
      # result browser-integration evidence rather than a Gate B pass. It must FAIL, never skip: exit 2
      # (no engine at all) is a blocked gate, not a green one.
      - name: Real-browser agent fixtures
        run: |
          npx tsc -b packages/shared-types packages/proxy packages/fingerprint packages/agent \
            packages/engine-runner
          node ci/validation/e2e/agent-browser-e2e.mjs --keep-going

  # The SOFTWARE tier of docs/OPERATIONS.md (§3): catalog diversity, coherence over 6000 personas, and
  # the derivation/coherence unit contracts. Runs anywhere — no GPU, no proxy, no browser.
  #
  # This job used to run `ci/validation/run.mjs`, which derived a fingerprint and applied it over CDP
  # through patchright. That harness was deleted with the CDP-spoofing path it exercised (production
  # fingerprinting is native — docs/ENGINEERING.md §1), so the job had been failing on every run. The
  # heavier tiers it cannot cover here are the real-GPU gate (real-gpu-gate.yml) and lobium-detect.
  fingerprint-gate:
    name: Fingerprint software gate (coherence / diversity / regressions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --no-audit --no-fund
      # Build the packages the harness imports, plus the fingerprint unit tests it runs from dist/.
      - run: npx tsc -b packages/shared-types packages/proxy packages/fingerprint packages/engine-runner
      - name: Run the software regression gate
        env:
          LOBSTER_LOBIUM_BIN: ${{ vars.LOBSTER_LOBIUM_BIN }}
        run: |
          # The live TLS/JA4 check reads a real ClientHello and therefore needs a built Lobium binary,
          # which github-hosted runners do not have. Skip it cleanly there (JA4 is gated on the
          # self-hosted real-GPU runner); run it whenever a binary IS provisioned.
          if [ -z "${LOBSTER_LOBIUM_BIN:-}" ] || [ ! -x "$LOBSTER_LOBIUM_BIN" ]; then
            echo "No Lobium binary on this runner — skipping the live TLS/JA4 check."
            export SKIP_TLS=1
          fi
          node ci/validation/regression-gate.mjs
      # Grader strength for the LIVE battery. Needs no browser, model or credit, so it runs here rather
      # than in the opt-in job: a grader that a model can satisfy blind turns a capability test into a
      # trivia quiz, and that regression must be caught on every PR.
      - run: node --test ci/validation/agent-battery.test.mjs
      # The validation harnesses' own tests. Each of these pins a grader or a contract that decides
      # whether a later gate can be trusted, and every one of them was executed by no workflow — so a
      # regression in the detector-matrix grader or the native-policy contract reached main green.
      - run: node ci/validation/detector-matrix.mjs --check
      - run: node --test ci/validation/detector-matrix.test.mjs ci/validation/antibot-exam.test.mjs ci/validation/native-policy-contract.test.mjs ci/validation/version-coherence.test.mjs
      # Offline W4 guard: the build ref, the UA-claimed version, and the engine manifest must agree,
      # and the pin must not be a canary/branch-point build. This is what would have caught the repo
      # sitting on canary 152.0.7928.0. The ONLINE half (is the pin behind stable / still a real
      # release) is scripts/track-upstream.mjs, run non-blocking so a new stable does not red every PR.
      - name: Chrome-version tracker (report only)
        continue-on-error: true
        run: node scripts/track-upstream.mjs
