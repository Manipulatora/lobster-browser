name: Real-GPU stealth gate

# QA-1 blocking gate. Runs the native Lobium detector + the CreepJS battle matrix on a SELF-HOSTED
# runner that has a real consumer GPU and a built Lobium binary, then applies ci/validation/gate.mjs
# as a strict referee: it FAILS unless the run used real hardware (not SwiftShader) AND every scored
# CreepJS situation had zero lies. This converts "proven on SwiftShader" into a real, falsifiable claim.
#
# This is NOT the ubuntu-latest CI (github-hosted runners have no GPU/Lobium binary). Set up the
# self-hosted GPU runner per docs/ENGINEERING.md (§4), then:
#   - label it `gpu`
#   - set repo variables: LOBSTER_LOBIUM_BIN, LOBSTER_FONTS_DIR, DISPLAY, and (optional)
#     LOBSTER_ANGLE_BACKEND / VK_ICD_FILENAMES
# The job is manual + nightly by default so a missing/asleep GPU box never blocks normal PR CI. Flip
# `pull_request` on once the runner is reliably online to make it a true per-PR merge gate.

on:
  workflow_dispatch:
    inputs:
      creepjs_limit:
        description: 'Max CreepJS situations to run'
        required: false
        default: '120'
      min_situations:
        description: 'Minimum situations the gate requires'
        required: false
        default: '100'
  schedule:
    # 05:00 UTC nightly — records a real-GPU zero-lies datapoint each day.
    - cron: '0 5 * * *'
  # Uncomment to make this a per-PR merge gate once the self-hosted GPU runner is reliably online:
  # pull_request:
  #   branches: [main]

concurrency:
  group: real-gpu-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  PUPPETEER_SKIP_DOWNLOAD: '1'

jobs:
  real-gpu-gate:
    name: Native Lobium real-GPU zero-lies gate
    # Requires a self-hosted runner tagged `gpu` with a physical GPU + a built Lobium binary.
    runs-on: [self-hosted, gpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install --no-audit --no-fund

      # Build the packages the validation scripts + gate import (their dist output).
      - name: Build validation deps
        run: npx tsc -b packages/shared-types packages/proxy packages/fingerprint packages/engine-runner

      - name: Preflight — confirm real GPU + Lobium binary + open-font pack
        env:
          LOBSTER_LOBIUM_BIN: ${{ vars.LOBSTER_LOBIUM_BIN }}
          LOBSTER_FONTS_DIR: ${{ vars.LOBSTER_FONTS_DIR }}
        run: |
          if [ -z "${LOBSTER_LOBIUM_BIN:-}" ] || [ ! -x "$LOBSTER_LOBIUM_BIN" ]; then
            echo "::error::LOBSTER_LOBIUM_BIN unset or not executable ($LOBSTER_LOBIUM_BIN)."
            echo "Set the repo variable LOBSTER_LOBIUM_BIN to the built Lobium chrome binary on this runner."
            exit 1
          fi
          echo "Lobium binary: $LOBSTER_LOBIUM_BIN"
          # The product E2E launch is font-isolated and REFUSES to start without a provisioned pack, so
          # check it here where the error names the missing repo variable rather than 20 minutes in.
          if [ ! -f "${LOBSTER_FONTS_DIR:-}/font-pack.manifest.json" ]; then
            echo "::error::LOBSTER_FONTS_DIR has no font-pack.manifest.json ($LOBSTER_FONTS_DIR)."
            echo "Set the repo variable LOBSTER_FONTS_DIR to the open-font pack on this runner (scripts/provision-open-fonts.mjs output, or <install>/lobium/fonts)."
            exit 1
          fi
          echo "Open-font pack: $LOBSTER_FONTS_DIR"

      # Fast GPU-independent plumbing check: proves the HC-4 deep-WebGL hook is compiled + live in the
      # binary (sentinel values round-trip). Cheap early failure if a rebuild dropped the hook.
      - name: HC-4 deep-WebGL hook probe
        env:
          LOBSTER_LOBIUM_BIN: ${{ vars.LOBSTER_LOBIUM_BIN }}
        run: node ci/validation/hc4-probe.mjs

      # The repo's ONLY real-engine persistence proof: create a profile, launch it through the exact
      # sidecar path the desktop Launch button uses, prove the imported cookies reached the jar, then
      # RELAUNCH the same profile and prove the jar, the exported cookies and the loaded extension all
      # survived. It was invoked by no workflow at all — only non-blockingly late in
      # scripts/build-linux-product.sh — so a regression breaking cookie or extension persistence
      # across relaunch reached main green. Blocking, and it lives here rather than in ci.yml because
      # `lobium` is the only registered launcher (runners/default-launchers.ts:29-31): without the
      # native binary this runner provides, the harness cannot launch anything at all.
      - name: Product E2E (create / launch / relaunch persistence)
        env:
          LOBSTER_LOBIUM_BIN: ${{ vars.LOBSTER_LOBIUM_BIN }}
          LOBSTER_FONTS_DIR: ${{ vars.LOBSTER_FONTS_DIR }}
          LOBSTER_GPU: gpu
          LOBSTER_ANGLE_BACKEND: ${{ vars.LOBSTER_ANGLE_BACKEND || 'vulkan' }}
          VK_ICD_FILENAMES: ${{ vars.VK_ICD_FILENAMES }}
          DISPLAY: ${{ vars.DISPLAY || ':0' }}
        run: node ci/validation/product-e2e.mjs

      - name: Native Lobium detector (real GPU)
        env:
          LOBSTER_LOBIUM_BIN: ${{ vars.LOBSTER_LOBIUM_BIN }}
          LOBSTER_GPU: gpu
          LOBSTER_ANGLE_BACKEND: ${{ vars.LOBSTER_ANGLE_BACKEND || 'vulkan' }}
          VK_ICD_FILENAMES: ${{ vars.VK_ICD_FILENAMES }}
          DISPLAY: ${{ vars.DISPLAY || ':0' }}
        run: node ci/validation/lobium-detect.mjs

      - name: CreepJS battle matrix (real GPU)
        env:
          LOBSTER_LOBIUM_BIN: ${{ vars.LOBSTER_LOBIUM_BIN }}
          LOBSTER_GPU: gpu
          LOBSTER_ANGLE_BACKEND: ${{ vars.LOBSTER_ANGLE_BACKEND || 'vulkan' }}
          VK_ICD_FILENAMES: ${{ vars.VK_ICD_FILENAMES }}
          DISPLAY: ${{ vars.DISPLAY || ':0' }}
          LOBSTER_CREEPJS_LIMIT: ${{ github.event.inputs.creepjs_limit || '120' }}
          LOBSTER_CREEPJS_CONCURRENCY: '1'
        run: node ci/validation/creepjs-battle.mjs

      # The strict referee. FAILS unless real-hardware AND every situation zero-lies. This is what makes
      # the SwiftShader 120/120 false-pass impossible to merge.
      - name: Strict gate (real-GPU + zero lies)
        env:
          LOBSTER_GATE_MIN_SITUATIONS: ${{ github.event.inputs.min_situations || '100' }}
          LOBSTER_GATE_REQUIRE_DETECT: '1'
        run: node ci/validation/gate.mjs

      # ── The per-aspect anti-detect gate ─────────────────────────────────────────────────────────
      #
      # audit-oracles + font-isolation-gate existed as npm scripts that NO workflow ran, so an
      # anti-detect regression — a canvas readback drifting, the font filter disengaging, the persona
      # timezone silently not applying — could reach main green. They are blocking steps here, on the
      # only runner that has an engine to measure.
      #
      # The TLS gate runs first because the oracles fold its report into the networkTls/networkHttp2
      # aspects and refuse anything older than two hours: those two aspects are not readable from a
      # page, and a run that never touched the network must not score them.
      - name: TLS / HTTP2 network fingerprint vs stock Chrome
        env:
          LOBSTER_LOBIUM_BIN: ${{ vars.LOBSTER_LOBIUM_BIN }}
          LOBSTER_STOCK_CHROME_BIN: ${{ vars.LOBSTER_STOCK_CHROME_BIN }}
          OSES: windows,linux
          DISPLAY: ${{ vars.DISPLAY || ':0' }}
        run: |
          set +e
          node ci/validation/tls-fingerprint.mjs
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            # Not failed here, because "we could not measure" is not "we measured and it was wrong" —
            # but it is not swept away either: the oracle step below scores networkTls/networkHttp2 as
            # BLOCKED without this report and fails on it, which is the intended pressure.
            echo "::warning::TLS gate BLOCKED — no stock Chrome reference, or the echo was unreachable."
            echo "Set the repo variable LOBSTER_STOCK_CHROME_BIN to a stock Chrome of the same major, or pin"
            echo "a reference with: node ci/validation/tls-fingerprint.mjs --capture-reference"
            exit 0
          fi
          exit $code

      # Headful on purpose: several oracles (real GPU, window geometry, media queries) only behave
      # honestly headful, and the report marks a headless run as NOT release evidence.
      #
      # Both persona OSes: Windows ships first, and a Linux-only run leaves every Windows-specific
      # surface — font isolation, native timezone, UA-CH platformVersion — unmeasured.
      - name: Anti-detect oracles (per-aspect, blocking)
        env:
          LOBSTER_LOBIUM_BIN: ${{ vars.LOBSTER_LOBIUM_BIN }}
          LOBSTER_FONTS_DIR: ${{ vars.LOBSTER_FONTS_DIR }}
          LOBSTER_GPU: gpu
          LOBSTER_ANGLE_BACKEND: ${{ vars.LOBSTER_ANGLE_BACKEND || 'vulkan' }}
          VK_ICD_FILENAMES: ${{ vars.VK_ICD_FILENAMES }}
          DISPLAY: ${{ vars.DISPLAY || ':0' }}
          LOBIUM_ORACLES_HEADFUL: '1'
          LOBIUM_ORACLE_OS: ${{ vars.LOBIUM_ORACLE_OS || 'windows,linux' }}
          LOBIUM_ORACLE_EXIT_IP: ${{ vars.LOBIUM_ORACLE_EXIT_IP }}
        run: |
          set +e
          npm run gate:oracles
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::error::Oracle gate BLOCKED (exit 2). The engine could not be measured — a build missing"
            echo "hooks the launcher requires, or an aspect whose every probe was inconclusive. This is NOT a"
            echo "pass and NOT a regression; see the ORACLE GATE line above for which aspect blocked."
          elif [ "$code" != "0" ]; then
            echo "::error::Oracle gate FAILED (exit 1). A closed anti-detect finding is detectable again —"
            echo "see the REGRESSIONS section above and ci/validation/reports/aspect-coverage.json."
          fi
          exit $code

      # Proves the Windows DirectWrite font filter actually engages, using a deliberately tiny persona
      # font list that a realistic persona cannot discriminate. Self-skips (exit 0) on a build that does
      # not carry the font-isolation capability, which is every non-Windows build.
      - name: Font isolation gate (blocking)
        env:
          LOBSTER_LOBIUM_BIN: ${{ vars.LOBSTER_LOBIUM_BIN }}
          LOBSTER_FONTS_DIR: ${{ vars.LOBSTER_FONTS_DIR }}
          DISPLAY: ${{ vars.DISPLAY || ':0' }}
        run: npm run gate:fonts

      # The dated ledger for the detectors no parser scores. Emitted every run so the release review has
      # a current statement of which manual evidence exists and which is missing.
      - name: Detector checklist (dated ledger)
        if: always()
        run: node ci/validation/detector-checklist.mjs

      # Non-blocking: record a real anti-bot datapoint on real hardware each run. A detector "fail" is a
      # product signal to triage, not a red build — so this never fails the gate.
      - name: Anti-bot exam (record datapoint)
        continue-on-error: true
        env:
          LOBSTER_LOBIUM_BIN: ${{ vars.LOBSTER_LOBIUM_BIN }}
          LOBSTER_GPU: gpu
          LOBSTER_ANGLE_BACKEND: ${{ vars.LOBSTER_ANGLE_BACKEND || 'vulkan' }}
          VK_ICD_FILENAMES: ${{ vars.VK_ICD_FILENAMES }}
          DISPLAY: ${{ vars.DISPLAY || ':0' }}
          LOBSTER_EXAM_URLS: ${{ vars.LOBSTER_EXAM_URLS }}
        run: node ci/validation/antibot-exam.mjs

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-gpu-reports-${{ github.run_id }}
          path: ci/validation/reports/
          if-no-files-found: warn
          retention-days: 30

      # The per-aspect score on its own, so a release review does not have to dig through the full
      # report bundle to answer "which anti-detect aspects are green, and on what evidence".
      - name: Upload anti-detect aspect coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aspect-coverage-${{ github.run_id }}
          path: |
            ci/validation/reports/aspect-coverage.json
            ci/validation/reports/audit-oracles.json
            ci/validation/reports/tls-fingerprint.json
            ci/validation/reports/detector-checklist.md
          if-no-files-found: warn
          retention-days: 90
