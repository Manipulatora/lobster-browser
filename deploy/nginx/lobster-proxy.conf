# Shared upstream mapping for every Lobster backend location.
#
# lobster-backend.service listens on 127.0.0.1:8080 (PORT in the unit's EnvironmentFile). Included
# from each location rather than written once under `location /`, because nginx does not inherit
# directives into a more specific location: a rate-limited or unbuffered block that forgot these
# would proxy without X-Forwarded-For, and the app keys its per-IP bucket on that
# (`app.set('trust proxy', 1)` in apps/backend/src/main.ts) — every user would share one bucket.

proxy_pass         http://127.0.0.1:8080;
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# WebSocket / SSE support (the $connection_upgrade map lives in upgrade-map.conf).
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# The managed agent-LLM proxy holds a request open for the length of an upstream completion.
proxy_read_timeout 300s;
