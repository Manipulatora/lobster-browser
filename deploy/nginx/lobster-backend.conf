# Lobster backend — replaces what caddy was doing before nginx took over :443.
#
# caddy served `158-220-91-217.nip.io` and reverse-proxied it to localhost:8080
# (lobster-backend.service). That mapping is preserved verbatim here so nothing that
# depends on the endpoint breaks.

server {

    server_name 158-220-91-217.nip.io;

    # Profile-blob sync pushes the client-encrypted blob as base64 inside the JSON body, so nginx's
    # 1m default would 413 every realistic push with a bare HTML error page — no {code,data,msg}
    # envelope for the client to branch on and no audit entry. Sized to the backend's own ceiling
    # (BODY_LIMIT in apps/backend/src/body-limit.ts) rather than to the blob cap, so nginx is never
    # the component that rejects a body the backend would have accepted: DEFAULT_BLOB_MAX_BYTES is
    # 25 MiB of ciphertext, which is ~33.4 MiB once base64-expanded, plus the envelope around it.
    # Anything genuinely over the ceiling is refused by Express/Nest as JSON, which is the point.
    client_max_body_size 50m;

    # The backend sets its own security headers (helmet), so nginx does not add competing ones.
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / SSE support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/158-220-91-217.nip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/158-220-91-217.nip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = 158-220-91-217.nip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name 158-220-91-217.nip.io;
    return 404; # managed by Certbot


}