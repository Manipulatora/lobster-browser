# Lobster backend — the API origin the shipped clients call.
#
# `api.lobrowser.com` is compiled into the desktop app (DEFAULT_API_ORIGIN in
# apps/desktop/src-tauri/src/cloud_auth.rs) and derived by the web dashboard as `api.<hostname>`
# (apps/web/src/app/app.config.ts), so every sign-in, profile sync and billing call in the product
# lands here. It was serving live while this repo described only the nip.io host below, which meant
# the deployment could not be recreated from the tree.
#
# The nip.io block is kept because it is still the backend's own PUBLIC_BASE_URL: verification and
# password links minted before the move, and the NOWPayments IPN callback URL registered with the
# processor, all point at it. Retire it once PUBLIC_BASE_URL is api.lobrowser.com and no outstanding
# link or registered callback references the old host — both blocks proxy to the same service, so
# nothing else distinguishes them.

server {

    server_name api.lobrowser.com;

    # Profile-blob sync pushes the client-encrypted blob as base64 inside the JSON body, so nginx's
    # 1m default would 413 every realistic push with a bare HTML error page — no {code,data,msg}
    # envelope for the client to branch on and no audit entry. Sized to the backend's own ceiling
    # (BODY_LIMIT in apps/backend/src/body-limit.ts) rather than to the blob cap, so nginx is never
    # the component that rejects a body the backend would have accepted: DEFAULT_BLOB_MAX_BYTES is
    # 25 MiB of ciphertext, which is ~33.4 MiB once base64-expanded, plus the envelope around it.
    # Anything genuinely over the ceiling is refused by Express/Nest as JSON, which is the point.
    client_max_body_size 50m;

    # Credential-guessing surface: every route here either verifies a password/token or sends mail.
    # Regex locations win over the `/` prefix, so these are the only routes that carry the throttle.
    # `password` is the change (verifies the current password), `password/forgot` sends mail and
    # `password/reset` verifies a six-digit code — the same three shapes as the sign-up routes.
    location ~ ^/auth/(login|register|verify-email|resend-verification|password)(/session|/forgot|/reset)?$ {
        limit_req zone=lobster_auth burst=10 nodelay;
        include /etc/nginx/snippets/lobster-proxy.conf;
    }

    # Deposit/purchase creation. NOT /billing/webhook: that is the payment processor's IPN callback,
    # and a throttled retry there is a credit that never lands.
    location ~ ^/billing/(deposits|purchase)$ {
        limit_req zone=lobster_billing burst=5 nodelay;
        include /etc/nginx/snippets/lobster-proxy.conf;
    }

    # The managed agent-LLM proxy streams SSE. The controller already sets `X-Accel-Buffering: no`
    # per response, but scoping the directive here means a future streaming route is not silently
    # buffered while everything else keeps nginx's response buffering.
    location /agent/llm/ {
        proxy_buffering off;
        include /etc/nginx/snippets/lobster-proxy.conf;
    }

    # The backend sets its own security headers (helmet), so nginx does not add competing ones.
    location / {
        include /etc/nginx/snippets/lobster-proxy.conf;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.lobrowser.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.lobrowser.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = api.lobrowser.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name api.lobrowser.com;
    return 404; # managed by Certbot


}


# Legacy host — caddy served `158-220-91-217.nip.io` and reverse-proxied it to localhost:8080
# (lobster-backend.service) before nginx took over :443. That mapping is preserved verbatim so
# nothing minted against the old origin breaks.

server {

    server_name 158-220-91-217.nip.io;

    client_max_body_size 50m;

    location ~ ^/auth/(login|register|verify-email|resend-verification|password)(/session|/forgot|/reset)?$ {
        limit_req zone=lobster_auth burst=10 nodelay;
        include /etc/nginx/snippets/lobster-proxy.conf;
    }

    location ~ ^/billing/(deposits|purchase)$ {
        limit_req zone=lobster_billing burst=5 nodelay;
        include /etc/nginx/snippets/lobster-proxy.conf;
    }

    location /agent/llm/ {
        proxy_buffering off;
        include /etc/nginx/snippets/lobster-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/lobster-proxy.conf;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/158-220-91-217.nip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/158-220-91-217.nip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = 158-220-91-217.nip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name 158-220-91-217.nip.io;
    return 404; # managed by Certbot


}
