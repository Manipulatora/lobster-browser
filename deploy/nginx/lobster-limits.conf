# http-context hardening shared by both vhosts. Loaded from the same place as upgrade-map.conf —
# `limit_req_zone` and `server_tokens` are only valid in the http block, not inside a server.

# The response served today announces `Server: nginx/1.24.0 (Ubuntu)`, which tells a scanner which
# CVEs to try before it sends a second request.
server_tokens off;

# Edge throttle for the endpoints an attacker replays: sign-in/registration guessing and deposit
# creation. The app's own express-rate-limit is a single 120 req/min bucket across every route
# (RATE_LIMIT_MAX in apps/backend/src/main.ts), so a login-guessing flood stays under it while still
# consuming a bcrypt verification per request; these zones stop that in nginx, before Node.
#
# Keyed on $binary_remote_addr rather than X-Forwarded-For: at the edge the peer address is the
# client, and a header key would be trivially spoofable. 10m holds ~160k distinct addresses.
limit_req_zone $binary_remote_addr zone=lobster_auth:10m    rate=20r/m;
limit_req_zone $binary_remote_addr zone=lobster_billing:10m rate=30r/m;

# 429, not nginx's 503 default: the clients treat 5xx as "the API is down" and retry, which is the
# opposite of what a throttled caller should do.
limit_req_status 429;
