# Lobster Browser — marketing site (prerendered Angular, served as static files).
#
# Every route was prerendered to its own index.html, so nginx serves HTML straight from disk and
# there is no Node process to keep alive.

server {

    # server_name is filled in once the domain is pointed here; until then this block answers on
    # the bare IP as the default server.
    server_name lobrowser.com www.lobrowser.com;

    root /var/www/lobster;
    index index.html;

    # --- security headers -------------------------------------------------------------------
    # includeSubDomains matches what the API already sends (helmet on api.lobrowser.com) and covers
    # the dashboard's `api.<hostname>` derivation. No `preload`: that is a one-way submission to a
    # list baked into browsers, and it would strand any future subdomain that cannot serve HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                always;
    add_header X-Frame-Options           "SAMEORIGIN"             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # --- compression ------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/xml+rss image/svg+xml application/manifest+json;

    # --- routing ----------------------------------------------------------------------------
    # $uri/            -> /pricing/ finds the prerendered /pricing/index.html
    # /index.html      -> anything unknown boots the app, whose router redirects home
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # Build output is content-hashed, so it can be cached forever.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Images change without a hash in the filename — cache, but allow revalidation.
    location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
        try_files $uri =404;
    }

    # HTML must never be cached hard, or a deploy leaves users on a stale shell that references
    # asset hashes which no longer exist.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # --- installers ---------------------------------------------------------------------------
    # The download PAGE is a prerendered Angular route at /download/; the installer FILES sit at
    # /download/<name>.exe|.deb on the same path, which is what keeps a customer on one origin from
    # the page to the bytes (see apps/web/.../downloads.catalog.ts for why they left GitHub). The
    # engine archives the app fetches on first run sit under /download/engine/.
    #
    # Served from a SEPARATE root. /var/www/lobster is replaced wholesale on every site deploy, so a
    # 200 MB installer living there would be deleted by the next `ng build` upload and the page's
    # own buttons would start 404ing. The regex admits only real installer file names, so every
    # other URL under /download/ still falls through to `location /` and renders the page.
    # `engine/` is the one permitted sub-path: the browser engine is downloaded on first run from
    # /download/engine/<archive>, by the app rather than by a person. One location serves both so
    # there is a single place where the download headers and the disk root are defined.
    location ~ "^/download/(?<asset>(?:engine/)?[A-Za-z0-9][A-Za-z0-9._+-]*\.(?:exe|deb|AppImage|dmg|zip|tar\.gz|sig|sha256))$" {
        alias /var/www/lobster-downloads/$asset;

        # An installer is immutable: its version is in its file name, so a changed build is a
        # changed URL. Long cache, and `immutable` so a reload does not re-fetch 200 MB.
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Offer it as a save, not as something the browser tries to interpret.
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;

        # Large sequential reads: skip the copy through nginx's userspace buffers, and do not try to
        # gzip an already-compressed archive.
        sendfile        on;
        tcp_nopush      on;
        gzip            off;
        # Resumable, which matters at this size on a bad connection.
        add_header Accept-Ranges "bytes" always;

        access_log /var/log/nginx/lobster-downloads.log;
        # No try_files: `alias` already names the exact file, and a missing one 404s on its own.
        # A try_files here would re-enter the location and loop.
    }

    # Don't hand out dotfiles.
    location ~ /\. {
        deny all;
    }

    error_page 404 /index.html;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lobrowser.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lobrowser.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.lobrowser.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = lobrowser.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name lobrowser.com www.lobrowser.com;
    return 404; # managed by Certbot




}