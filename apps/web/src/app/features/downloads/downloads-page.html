<!-- Deliberately bare. Everything this page used to explain - install requirements, an unsigned-
     installer warning, checksums and the command to check them - was text standing between someone
     who already decided to install and the installer. -->
<div class="container-page py-14 sm:py-20">
  <div class="mx-auto w-full max-w-2xl">
    <section class="text-center">
      <h1 class="text-4xl tracking-[-0.03em] text-ink sm:text-5xl">Lobster Browser</h1>
      <p class="mt-3 text-[0.9375rem] text-muted">
        Version {{ version }} · engine {{ engineVersion }}
      </p>
    </section>

    <div class="mt-10 grid gap-4 sm:grid-cols-2">
      @for (item of artifacts(); track item.platform) {
        <article class="card flex flex-col items-center gap-5 p-8 text-center">
          <!-- Drawn inline in currentColor rather than fetched: one box always renders unpublished,
               and an icon that arrives late or not at all makes that box look broken. -->
          @switch (item.platform) {
            @case ('windows') {
              <svg class="size-12 text-ink-soft" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M2.6 5.3 10.6 4.2v7.3H2.6z" />
                <path d="M11.8 4.05 21.4 2.7v8.8h-9.6z" />
                <path d="M2.6 12.5h8v7.3L2.6 18.7z" />
                <path d="M11.8 12.5h9.6v8.8l-9.6-1.35z" />
              </svg>
            }
            @case ('linux') {
              <svg class="size-12 text-ink-soft" viewBox="0 0 24 24" aria-hidden="true">
                <!-- Feet first, so the body overlaps them. -->
                <ellipse
                  cx="8.7"
                  cy="20.6"
                  rx="3"
                  ry="1.45"
                  fill="currentColor"
                  transform="rotate(-17 8.7 20.6)"
                />
                <ellipse
                  cx="15.3"
                  cy="20.6"
                  rx="3"
                  ry="1.45"
                  fill="currentColor"
                  transform="rotate(17 15.3 20.6)"
                />
                <!-- One evenodd path: the silhouette, with the belly and both eyes as HOLES rather
                     than lighter fills. A hole shows whatever the card is painted in, so the mark
                     reads correctly in either theme; a hard-coded pale belly would go black-on-black
                     the moment the page is viewed in dark mode. -->
                <path
                  fill="currentColor"
                  fill-rule="evenodd"
                  d="M12 2.2C9.6 2.2 7.9 4 7.9 6.3c0 1-.2 1.7-.2 2.5C6.6 10.8 5.2 13.3 5.2 16.2c0 3.4 2.8 5.4 6.8 5.4s6.8-2 6.8-5.4c0-2.9-1.4-5.4-2.5-7.4-.4-.8-.2-1.5-.2-2.5C16.1 4 14.4 2.2 12 2.2ZM8.4 15.3a3.6 5 0 1 0 7.2 0 3.6 5 0 1 0-7.2 0ZM9.3 5.9a1 1.35 0 1 0 2 0 1 1.35 0 1 0-2 0ZM12.7 5.9a1 1.35 0 1 0 2 0 1 1.35 0 1 0-2 0Z"
                />
                <ellipse cx="10.55" cy="6.05" rx="0.5" ry="0.72" fill="currentColor" />
                <ellipse cx="13.45" cy="6.05" rx="0.5" ry="0.72" fill="currentColor" />
                <!-- The one literal colour on the page: a currentColor beak would vanish into the
                     head it sits on. -->
                <path
                  fill="#f0a028"
                  d="M12 7.35c1.28 0 2.2.6 2.2 1.3s-.92 1.2-2.2 1.2-2.2-.5-2.2-1.2.92-1.3 2.2-1.3Z"
                />
              </svg>
            }
          }

          <h2 class="text-lg text-ink">{{ item.name }}</h2>

          @if (item.published) {
            <a
              [href]="item.url"
              [attr.download]="item.file"
              class="btn btn-md btn-primary"
              rel="noopener"
            >
              Download
            </a>
          } @else {
            <button type="button" class="btn btn-md btn-secondary" disabled>Coming soon</button>
          }
        </article>
      }
    </div>
  </div>
</div>
