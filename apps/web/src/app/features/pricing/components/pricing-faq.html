<div class="card divide-y-[0.5px] divide-hairline overflow-hidden">
  @for (faq of faqs; track faq.id) {
    <details class="group">
      <summary
        class="flex cursor-pointer list-none items-center justify-between gap-6 px-5 py-4 text-[0.9375rem] font-medium text-ink transition-colors duration-200 hover:bg-surface-soft sm:px-6 sm:py-5 [&::-webkit-details-marker]:hidden"
      >
        <span class="text-pretty">{{ faq.question }}</span>
        <ng-icon
          name="heroChevronDown"
          size="18"
          class="shrink-0 text-brand-600 transition-transform duration-200 group-open:rotate-180"
          aria-hidden="true"
        />
      </summary>
      <p class="max-w-3xl px-5 pb-5 text-sm leading-relaxed text-muted sm:px-6 sm:pb-6">
        {{ faq.answer }}
      </p>
    </details>
  }
</div>
