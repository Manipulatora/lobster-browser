<!-- -mt-16 cancels the shell's header offset so a backdrop can run to the very top of the page,
     behind the transparent nav; the padding below restores breathing room for the content.

     Everything conditional here hangs off `backdrop` in hero-section.ts. The xylophone (false, the
     default) washes the section in a LIGHT violet, so the copy is plain black throughout — the
     `on-scene`/white treatment is for the older, genuinely dark night-sky shader (true) only. -->
<section
  [appHeaderBackdropTint]="backdrop"
  class="relative isolate -mt-16 flex min-h-[42rem] items-center overflow-hidden lg:min-h-[46rem]"
>
  @if (backdrop) {
    <!-- Layer 1: a still stand-in in the scene's own colours, so there is no white flash before the
         shader paints and no empty box where WebGL is unavailable. -->
    <div class="absolute inset-0 -z-20 bg-hero-fallback"></div>

    <!-- Layer 2: the animated shader canvas, fading in once it has a frame to show. -->
    <app-hero-backdrop class="absolute inset-0 -z-10" />
  } @else {
    <!-- The xylophone is the hero's own backdrop now, bounded by nothing but this section — full
         bleed behind the copy, not a framed card beside it. -->
    <app-xylophone-hero class="absolute inset-0 -z-10" />
  }

  <!-- pointer-events-none: this wrapper is full-width (container-page), but only the text column
       inside it has any content. Left auto, its empty box — everywhere to the right of the copy —
       would sit over the canvas and swallow every hover/click before the xylophone ever saw it. -->
  <div class="container-page pointer-events-none relative w-full pb-24 pt-40 sm:pt-44">
    <div class="pointer-events-auto max-w-2xl">
      <h1
        class="text-balance text-5xl leading-[1.04] tracking-[-0.03em] sm:text-6xl lg:text-[4.5rem]"
        [class]="backdrop ? 'on-scene text-white' : 'text-black'"
      >
        Manage accounts securely.
        <span class="block" [class]="backdrop ? 'text-brand-200' : 'text-black'">
          Save time with AI agents.
        </span>
      </h1>

      <p
        class="mt-7 max-w-xl text-pretty text-base leading-relaxed sm:text-lg"
        [class]="backdrop ? 'on-scene text-white/85' : 'text-black'"
      >
        Run secure browser profiles at scale—no bans, no busywork.
      </p>

      <div class="mt-10 flex flex-wrap items-center gap-5">
        <app-shiny-cta link="/signup">Get started</app-shiny-cta>
        <a
          routerLink="/pricing"
          class="nav-link text-[0.9375rem]"
          [class]="backdrop ? 'on-scene text-white/85' : ''"
        >
          View pricing
        </a>
      </div>
    </div>
  </div>
</section>
