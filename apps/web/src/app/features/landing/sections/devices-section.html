<!-- A tall scroll track holding a sticky viewport-height stage.
     Scrolling through the track is what plays the animation: the laptop opens, then the phone
     rises. The section is deliberately free of chrome — no panel, no border, no copy. -->
<section id="devices" class="relative h-[280vh] bg-surface">
  <div #stage class="sticky top-0 flex h-dvh w-full items-center justify-center overflow-hidden">
    <canvas
      #canvas
      class="h-full w-full transition-opacity duration-700"
      [class.opacity-0]="!loaded()"
      [class.opacity-100]="loaded()"
    ></canvas>

    <!-- Screen-reader description, since the sequence is purely visual. -->
    <span class="sr-only">
      A MacBook and an iPhone running Lobster Browser. Scrolling opens the laptop to reveal the
      profile manager, then raises the phone alongside it.
    </span>
  </div>
</section>
