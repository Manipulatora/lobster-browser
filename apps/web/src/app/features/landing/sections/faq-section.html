<!-- Two columns on desktop: the heading parks itself on the left while the questions scroll past
     it, so the section keeps its title even at the bottom of a long list. Single column below lg,
     where a sticky heading would just eat the viewport. -->
<section id="faq" class="section bg-surface">
  <div class="container-page">
    <div class="grid gap-12 lg:grid-cols-[20rem_1fr] lg:gap-20">
      <div class="lg:sticky lg:top-28 lg:self-start">
        <p class="eyebrow">FAQ</p>
        <h2 class="section-title mt-3">Questions, answered</h2>
        <p class="section-lede mt-4">
          The things people ask before they switch. If yours is not here, we answer email quickly.
        </p>
        <a routerLink="/auth/sign-up" class="btn btn-md btn-secondary mt-8">Talk to us</a>
      </div>

      <ul class="divide-y-[0.5px] divide-hairline border-y-[0.5px] border-hairline">
        @for (item of faqs; track item.question; let i = $index) {
          <li>
            <!-- h3 wrapping the button keeps the questions in the heading outline; the button is
                 what carries the expanded state for assistive tech. -->
            <h3>
              <button
                type="button"
                class="group flex w-full items-start justify-between gap-6 py-6 text-left transition-colors hover:text-brand-700"
                [attr.aria-expanded]="openIndex() === i"
                [attr.aria-controls]="'faq-panel-' + i"
                [id]="'faq-trigger-' + i"
                (click)="toggle(i)"
              >
                <span class="text-[1.0625rem] leading-snug text-ink sm:text-lg">
                  {{ item.question }}
                </span>
                <span
                  class="mt-0.5 flex size-7 shrink-0 items-center justify-center rounded-full border-[0.5px] border-hairline-strong text-ink-soft transition-colors group-hover:border-brand-300 group-hover:bg-brand-50 group-hover:text-brand-700"
                >
                  <span class="icon text-[18px]">{{ openIndex() === i ? 'remove' : 'add' }}</span>
                </span>
              </button>
            </h3>

            <!-- 0fr -> 1fr on a grid row is the one way to transition to a content-derived height
                 without measuring it in JS; the inner overflow-hidden is what actually clips the
                 answer while the row collapses. -->
            <div
              class="grid transition-[grid-template-rows] duration-300 ease-out"
              [class]="openIndex() === i ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]'"
              [id]="'faq-panel-' + i"
              role="region"
              [attr.aria-labelledby]="'faq-trigger-' + i"
            >
              <div class="overflow-hidden">
                <p class="max-w-2xl pb-6 pr-10 text-[0.9375rem] leading-relaxed text-muted">
                  {{ item.answer }}
                </p>
              </div>
            </div>
          </li>
        }
      </ul>
    </div>
  </div>
</section>
