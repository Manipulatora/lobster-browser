<h1 class="text-2xl tracking-[-0.02em] text-ink">Sign in</h1>

<form [formGroup]="form" (ngSubmit)="submit()" class="mt-8" novalidate>
  <div>
    <label class="field-label" for="email">Email</label>
    <input
      id="email"
      type="email"
      class="field-input"
      formControlName="email"
      autocomplete="email"
      [attr.aria-invalid]="invalid('email') ? 'true' : null"
      [attr.aria-describedby]="invalid('email') ? 'email-error' : null"
    />
    @if (invalid('email')) {
      <p id="email-error" class="field-error">Enter a valid email address.</p>
    }
  </div>

  <div class="mt-5">
    <div class="mb-1.5 flex items-baseline justify-between gap-4">
      <label class="field-label mb-0" for="password">Password</label>
      <a
        routerLink="/auth/forgot-password"
        class="text-[0.8125rem] text-brand-600 transition-colors hover:text-brand-700"
      >
        Forgot?
      </a>
    </div>
    <div class="relative">
      <input
        id="password"
        [type]="showPassword() ? 'text' : 'password'"
        class="field-input pr-11"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="invalid('password') ? 'true' : null"
        [attr.aria-describedby]="invalid('password') ? 'password-error' : null"
      />
      <button
        type="button"
        class="absolute inset-y-0 right-0 flex w-11 items-center justify-center rounded-r-xl text-muted transition-colors hover:text-ink"
        [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        (click)="togglePassword()"
      >
        <span class="icon text-[20px]">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
      </button>
    </div>
    @if (invalid('password')) {
      <p id="password-error" class="field-error">Enter your password.</p>
    }
  </div>

  <button type="submit" class="btn btn-md btn-primary mt-7 w-full">Sign in</button>
</form>

<p class="mt-8 text-center text-[0.875rem] text-muted">
  No account?
  <a routerLink="/auth/sign-up" class="text-brand-600 transition-colors hover:text-brand-700">
    Create one
  </a>
</p>
