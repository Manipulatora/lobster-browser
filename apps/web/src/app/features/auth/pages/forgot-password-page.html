<h1 class="text-2xl tracking-[-0.02em] text-ink">Reset password</h1>

<form [formGroup]="form" (ngSubmit)="submit()" class="mt-8" novalidate>
  <div>
    <label class="field-label" for="email">Email</label>
    <input
      id="email"
      type="email"
      class="field-input"
      formControlName="email"
      autocomplete="email"
      [attr.aria-invalid]="invalidEmail ? 'true' : null"
      [attr.aria-describedby]="invalidEmail ? 'email-error' : null"
    />
    @if (invalidEmail) {
      <p id="email-error" class="field-error">Enter a valid email address.</p>
    }
  </div>

  <button type="submit" class="btn btn-md btn-primary mt-7 w-full">Send reset link</button>
</form>

<p class="mt-8 text-center text-[0.875rem]">
  <a
    routerLink="/login"
    class="inline-flex items-center gap-1.5 text-muted transition-colors hover:text-ink"
  >
    <span class="icon text-[18px]">arrow_back</span>
    Back to sign in
  </a>
</p>
