<!-- Transparent at the top, with a frosted backdrop once page content passes beneath the fixed bar. -->
<header
  class="fixed inset-x-0 top-0 z-50 transition-[background-color,box-shadow,backdrop-filter] duration-200"
  [class]="
    scrolled()
      ? onDarkBackdrop()
        ? 'bg-ink/70 shadow-[0_1px_0_rgba(255,255,255,0.10)] backdrop-blur-xl'
        : 'bg-white/80 shadow-[0_1px_0_rgba(15,23,42,0.08)] backdrop-blur-xl'
      : ''
  "
>
  <div class="container-page">
    <div class="flex h-16 items-center justify-between gap-6">
      <div class="flex items-center gap-8">
        <!-- The lockup is dark ink, which disappears against the night sky. brightness-0 flattens
             it to black and invert flips it to solid white — the whole mark, wordmark included. -->
        <app-logo [class]="onDarkBackdrop() ? 'brightness-0 invert' : ''" />

        <nav class="hidden items-center gap-6 lg:flex" aria-label="Primary">
          @for (link of nav; track link.label) {
            <a
              [routerLink]="link.path"
              [fragment]="link.fragment"
              routerLinkActive="nav-link-active"
              [routerLinkActiveOptions]="{
                paths: 'exact',
                queryParams: 'ignored',
                matrixParams: 'ignored',
                fragment: 'exact',
              }"
              class="nav-link text-[0.9375rem]"
              [class]="onDarkBackdrop() ? 'on-scene text-white/90' : ''"
            >
              {{ link.label }}
            </a>
          }
        </nav>
      </div>

      <div class="hidden items-center gap-4 lg:flex">
        @if (isAuthenticated()) {
          <a
            routerLink="/account/downloads"
            class="nav-link text-[0.9375rem]"
            [class]="onDarkBackdrop() ? 'on-scene text-white' : ''"
            >Downloads</a
          >
          <a
            routerLink="/account/billing"
            class="nav-link text-[0.9375rem]"
            [class]="onDarkBackdrop() ? 'on-scene text-white' : ''"
            >Account</a
          >
          <button
            type="button"
            class="nav-link text-[0.9375rem]"
            [class]="onDarkBackdrop() ? 'on-scene text-white' : ''"
            (click)="signOut()"
          >
            Sign out
          </button>
        } @else {
          <button
            type="button"
            class="nav-link text-[0.9375rem]"
            [class]="onDarkBackdrop() ? 'on-scene text-white' : ''"
            (click)="openAuth('sign-in')"
          >
            Log in
          </button>
          <button type="button" class="btn btn-sm btn-primary" (click)="openAuth('sign-up')">
            Sign up
          </button>
        }
      </div>

      <button
        type="button"
        class="btn btn-sm !px-2.5 lg:hidden"
        [class]="
          onDarkBackdrop()
            ? 'border-[0.5px] border-white/25 text-white hover:bg-white/10'
            : 'btn-secondary'
        "
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
        (click)="toggleMenu()"
      >
        <span class="icon text-[20px]">{{ menuOpen() ? 'close' : 'menu' }}</span>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <!-- The bar itself is transparent, but the expanded panel needs an opaque surface or the
         page scrolls visibly behind the links. -->
    <div id="mobile-menu" class="bg-white/95 backdrop-blur-xl lg:hidden">
      <nav class="container-page flex flex-col py-4" aria-label="Mobile">
        @for (link of nav; track link.label) {
          <a
            [routerLink]="link.path"
            [fragment]="link.fragment"
            (click)="closeMenu()"
            class="rounded-lg px-3 py-2.5 text-[0.9375rem] text-black transition-colors hover:bg-brand-50"
          >
            {{ link.label }}
          </a>
        }
        <div class="rule mt-3 flex flex-col gap-2 pt-4">
          @if (isAuthenticated()) {
            <a
              routerLink="/account/downloads"
              (click)="closeMenu()"
              class="btn btn-md btn-secondary"
            >
              Downloads
            </a>
            <a routerLink="/account/billing" (click)="closeMenu()" class="btn btn-md btn-secondary">
              Account
            </a>
            <button type="button" class="btn btn-md btn-ghost" (click)="signOut()">Sign out</button>
          } @else {
            <button type="button" class="btn btn-md btn-secondary" (click)="openAuth('sign-in')">
              Log in
            </button>
            <button type="button" class="btn btn-md btn-primary" (click)="openAuth('sign-up')">
              Sign up
            </button>
          }
        </div>
      </nav>
    </div>
  }
</header>
