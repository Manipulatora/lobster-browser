<!-- Fully transparent: no background, no border, no blur. The hero backdrop shows straight
     through it. `fixed` rather than `sticky` so the backdrop starts at the very top of the page
     instead of below the bar. -->
<header class="fixed inset-x-0 top-0 z-50">
  <div class="container-page">
    <div class="flex h-16 items-center justify-between gap-6">
      <div class="flex items-center gap-8">
        <!-- The lockup is dark ink, which disappears against the night sky. brightness-0 flattens
             it to black and invert flips it to solid white — the whole mark, wordmark included. -->
        <app-logo [class]="onDarkBackdrop() ? 'brightness-0 invert' : ''" />

        <nav class="hidden items-center gap-1 lg:flex" aria-label="Primary">
          @for (link of nav; track link.label) {
            <a
              [routerLink]="link.path"
              [fragment]="link.fragment"
              routerLinkActive="text-brand-700"
              [routerLinkActiveOptions]="{ exact: true }"
              class="rounded-full px-3 py-2 text-[0.875rem] transition-colors duration-200"
              [class]="
                onDarkBackdrop()
                  ? 'on-scene text-white/90 hover:bg-white/10 hover:text-white'
                  : 'text-ink-soft hover:bg-brand-50 hover:text-brand-700'
              "
            >
              {{ link.label }}
            </a>
          }
        </nav>
      </div>

      <div class="hidden items-center gap-2 lg:flex">
        <a
          routerLink="/auth/sign-in"
          class="btn btn-sm"
          [class]="onDarkBackdrop() ? 'on-scene text-white hover:bg-white/10' : 'btn-ghost'"
          >Sign in</a
        >
        <a routerLink="/auth/sign-up" class="btn btn-sm btn-primary">Start free</a>
      </div>

      <button
        type="button"
        class="btn btn-sm !px-2.5 lg:hidden"
        [class]="
          onDarkBackdrop()
            ? 'border-[0.5px] border-white/25 text-white hover:bg-white/10'
            : 'btn-secondary'
        "
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
        (click)="toggleMenu()"
      >
        <ng-icon [name]="menuOpen() ? 'heroXMark' : 'heroBars3'" size="20" />
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <!-- The bar itself is transparent, but the expanded panel needs an opaque surface or the
         page scrolls visibly behind the links. -->
    <div id="mobile-menu" class="bg-white/95 backdrop-blur-xl lg:hidden">
      <nav class="container-page flex flex-col py-4" aria-label="Mobile">
        @for (link of nav; track link.label) {
          <a
            [routerLink]="link.path"
            [fragment]="link.fragment"
            (click)="closeMenu()"
            class="rounded-lg px-3 py-2.5 text-[0.9375rem] text-ink-soft transition-colors hover:bg-brand-50 hover:text-brand-700"
          >
            {{ link.label }}
          </a>
        }
        <div class="rule mt-3 flex flex-col gap-2 pt-4">
          <a routerLink="/auth/sign-in" (click)="closeMenu()" class="btn btn-md btn-secondary">
            Sign in
          </a>
          <a routerLink="/auth/sign-up" (click)="closeMenu()" class="btn btn-md btn-primary">
            Start free
          </a>
        </div>
      </nav>
    </div>
  }
</header>
