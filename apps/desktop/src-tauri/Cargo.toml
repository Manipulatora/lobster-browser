[package]
name = "lobster-desktop"
version = "0.0.0"
description = "Lobster Browser desktop agent (Tauri 2 core + Axum local automation API)."
authors = ["Lobster Browser"]
edition = "2021"
# Minimum supported Rust (edition2024 deps require >= 1.85). Toolchain pinned in rust-toolchain.toml.
rust-version = "1.85"

# The Tauri app is compiled as a library so it can be linked into the platform binary
# (and, on mobile, into the generated shells). `main.rs` is a thin shim over `run()`.
[lib]
name = "lobster_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Generates the Tauri context (parses tauri.conf.json, embeds assets/capabilities).
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Serialization for IPC + the local automation API envelope.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# Async runtime for the background local-API server (spawned off the UI thread).
tokio = { version = "1", features = ["full"] }
# Local automation API (127.0.0.1 only). Auth + rate limiting land on Day 4.
axum = "0.7"

# Local encrypted-at-rest profile store. `bundled` compiles SQLite in — no system dep.
# `backup`: the page-stepping fallback the snapshot engine needs when a `VACUUM INTO` of a live
# profile database stays SQLITE_BUSY — see snapshot/sqlite_copy.rs.
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

# Stable profile / session identifiers.
uuid = { version = "1", features = ["v4"] }

# Password hashing for local profile lock metadata.
argon2 = "0.5"
password-hash = { version = "0.5", features = ["rand_core"] }

# SEC-12: authenticated at-rest encryption (AES-256-GCM) for secrets in the SQLite stores.
# Also the Windows-side (v10 DPAPI) Chromium cookie value cipher — "v10"‖nonce(12)‖ct‖tag(16).
aes-gcm = "0.10"
# Phase 3 OSCrypt codec: the Linux/macOS Chromium cookie value cipher is AES-128-CBC with a fixed
# 16×0x20 IV and PKCS#7 padding (`snapshot::oscrypt`). `aes` gives the raw block cipher, `cbc` the
# vetted mode — the same RustCrypto primitives Chromium's own values were sealed with, which is what
# makes the known-answer vectors meaningful rather than a re-derivation of our own arithmetic.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
# Chromium's OSCrypt key derivation is PBKDF2-HMAC-SHA1 (Linux 1 iter / macOS 1003 iters). SHA-1 is
# used ONLY as the KDF's PRF here, never as an integrity primitive — that is BLAKE3 (blob) and
# SHA-256 (the cookie domain-hash oracle) elsewhere.
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
# Encoding for ciphertext blobs + the persisted key file.
base64 = "0.22"
# SEC-2: OS keychain wrap for the Local Store Key (LSK) — Secret Service / DPAPI / Keychain.
# Falls back to the 0600 secrets.key file when no keyring backend is available (headless CI).
keyring = "3"
# HKDF for deriving Profile Content Keys from a Team Data Key (mirrors @lobster/crypto).
hkdf = "0.12"
sha2 = "0.10"

# ISO-8601 / RFC3339 timestamps for profile rows.
chrono = "0.4"

# HTTP client used for proxy testing and streaming the engine download from the Tauri core.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }

# First-run engine provisioning: stream-download a .tar.gz engine runtime and extract it.
tar = "0.4"
flate2 = "1"
futures-util = "0.3"

# Snapshot integrity: BLAKE3 over every artifact plaintext AND ciphertext, so a truncated or
# transplanted blob is caught before it is written into a user-data-dir.
blake3 = "1"
# Canonical-ish CBOR for the snapshot manifest and the DOM-storage record set: a self-describing
# binary encoding that round-trips arbitrary BLOBs, which JSON cannot without a base64 tax.
ciborium = "0.2"
# Wipe the Local Store Key copy the snapshot vault holds once the cipher is built.
zeroize = "1"

# Ergonomic error handling across the core.
anyhow = "1"

# Structured logging.
tracing = "0.1"
tracing-subscriber = "0.3"

# DSK-3: a second app launch focuses the first instance instead of contending on the
# local-API port / SQLite. Desktop-only plugin (no mobile support).
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"

# Windows OSCrypt v10 key custody (`snapshot::oscrypt::windows`): the 32-byte AES-256-GCM key is
# `base64("DPAPI" ‖ CryptProtectData(rawKey))` in Local State. CryptProtectData/CryptUnprotectData
# with no entropy bind the blob to the current user, so our own process both reads and creates it.
# Target-gated so a Linux `cargo test --lib` never pulls or compiles it; the pure v10 GCM value
# format in `oscrypt` is cfg-independent and unit-tested with an injected key on Linux.
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

# macOS OSCrypt v10 key custody (`snapshot::oscrypt::macos`): the v10 key is
# PBKDF2-HMAC-SHA1(1003, "saltysalt", <Keychain generic password>). Reading that generic password
# ("Chromium Safe Storage" / account "Chromium") is a Keychain access, gated behind explicit
# one-time consent at the call site. Target-gated for the same reason as the Windows dep; the mock
# key derivation and the --use-mock-keychain guard live in `oscrypt` cfg-independently and ARE
# unit-tested on Linux.
[target."cfg(target_os = \"macos\")".dependencies]
security-framework = "2"

[features]
# Enabled by tauri-cli in production builds; keeps custom-protocol assets embedded.
custom-protocol = ["tauri/custom-protocol"]
